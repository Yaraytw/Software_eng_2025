<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>後台管理 - 威宇影城</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🎥 威宇影城 <span style="font-size:14px; color:#666; margin-left:10px;">Admin Panel</span></a>
            <nav class="nav-links">
                <a href="index.html">回前台首頁</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="text-center" style="border:none;">⚙️ 管理者後台</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <!-- 新增電影 -->
            <div class="section-box">
                <h3>🎬 新增電影</h3>
                <label>電影名稱</label>
                <input type="text" id="mName" placeholder="例如: 復仇者聯盟">
                <label>分級</label>
                <select id="mGrade">
                    <option value="1">普遍級</option>
                    <option value="2">保護級</option>
                    <option value="3">輔導級</option>
                    <option value="4">限制級</option>
                </select>
                <button class="btn btn-primary" style="width:100%;" onclick="addMovie()">新增電影</button>
            </div>

            <!-- 新增場次 -->
            <div class="section-box">
                <h3>📅 新增場次</h3>
                <label>電影 ID</label>
                <input type="text" id="sMovieId" placeholder="輸入 Movie ID">
                <label>日期</label>
                <input type="date" id="sDate">
                <label>時間</label>
                <input type="time" id="sTime">
                <button class="btn btn-primary" style="width:100%;" onclick="addShowing()">新增場次</button>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function addMovie() {
            const name = document.getElementById('mName').value;
            const grade = document.getElementById('mGrade').value;
            const res = await callApi('admin_add_movie', { name, grade });
            alert(res.status ? "新增成功" : "失敗");
        }

        async function addShowing() {
            const movieId = document.getElementById('sMovieId').value;
            const date = document.getElementById('sDate').value;
            const time = document.getElementById('sTime').value;
            const res = await callApi('admin_add_showing', { movieId, date, time });
            alert(res.status ? "新增成功" : "失敗");
        }
    </script>
</body>
</html>
