<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會員登入 - 威宇影城</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-box { width: 100%; max-width: 400px; background: var(--card-bg); padding: 40px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid #444; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: var(--text-muted); transition: 0.3s; }
        .tab:hover { color: #fff; }
        .tab.active { border-bottom: 3px solid var(--primary-color); color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🎥 威宇影城</a>
            <nav class="nav-links">
                <a href="index.html">回首頁</a>
            </nav>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">會員登入</div>
                <div class="tab" onclick="switchTab('register')">註冊帳號</div>
            </div>

            <!-- 登入表單 -->
            <div id="loginForm">
                <label>帳號 (Email)</label>
                <input type="email" id="loginEmail" placeholder="name@example.com">
                
                <label>密碼</label>
                <input type="password" id="loginPwd" placeholder="請輸入密碼">
                
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="doLogin()">登入系統</button>
                
                <div class="text-right" style="margin-top:15px;">
                    <a href="forgot_password.html" style="color: var(--text-muted); font-size: 14px; text-decoration: none;">忘記密碼?</a>
                </div>
            </div>

            <!-- 註冊表單 -->
            <div id="registerForm" class="hidden">
                <input type="text" id="regId" placeholder="身分證字號 (帳號)">
                <input type="text" id="regName" placeholder="真實姓名">
                <input type="email" id="regEmail" placeholder="Email (信箱)">
                <input type="password" id="regPwd" placeholder="設定密碼">
                <input type="password" id="regPwd2" placeholder="確認密碼">
                <input type="text" id="regPhone" placeholder="手機號碼">
                <label style="font-size:14px; color:#aaa;">生日</label>
                <input type="date" id="regBirth" style="margin-top:5px;">
                
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="doRegister()">立即註冊</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="nav-container" style="justify-content: center;">
            <p>&copy; 2025 威宇影城.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.remove('hidden');
            document.getElementById(tab === 'login' ? 'registerForm' : 'loginForm').classList.add('hidden');
            event.target.classList.add('active');
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const pwd = document.getElementById('loginPwd').value;
            const res = await callApi('login', { account: email, pwd: pwd });
            alert(res.message);
            if (res.status) window.location.href = 'dashboard.html';
        }

        async function doRegister() {
            // 收集欄位資料
            const data = {
                memberId: document.getElementById('regId').value,
                memberName: document.getElementById('regName').value,
                memberEmail: document.getElementById('regEmail').value,
                memberPwd: document.getElementById('regPwd').value,
                memberPwdConfirm: document.getElementById('regPwd2').value,
                memberPhone: document.getElementById('regPhone').value,
                memberBirth: document.getElementById('regBirth').value,
                memberPwdHintId: 1, memberPwdHintAns: 'Default' // 簡化
            };
            const res = await callApi('register', data);
            alert(res.message);
            if (res.status === 'success') switchTab('login');
        }
    </script>
</body>
</html>
