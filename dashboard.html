<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會員中心 - 威宇影城</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Dashboard 專用佈局 */
        .dashboard-container { display: flex; gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .sidebar { width: 250px; flex-shrink: 0; }
        .menu-item { display: block; padding: 15px 20px; background: #1e1e1e; color: #fff; text-decoration: none; border-bottom: 1px solid #333; transition: 0.3s; }
        .menu-item:first-child { border-radius: 8px 8px 0 0; }
        .menu-item:last-child { border-radius: 0 0 8px 8px; border-bottom: none; }
        .menu-item:hover, .menu-item.active { background: var(--primary-color); color: #000; font-weight: bold; }
        
        .main-content { flex: 1; background: #1e1e1e; padding: 40px; border-radius: 8px; border: 1px solid #333; min-height: 500px; }
        
        /* 訂票卡片樣式 */
        .ticket-card { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🎥 威宇影城</a>
            <nav class="nav-links">
                <span class="text-muted" style="margin-right: 15px;">會員專區</span>
                <a href="#" onclick="logout()">登出</a>
            </nav>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- 左側選單 -->
        <div class="sidebar">
            <a onclick="showSection('booking')" id="nav-booking" class="menu-item active">🎟️ 線上訂票</a>
            <a onclick="showSection('myTickets')" id="nav-myTickets" class="menu-item">📜 訂票紀錄</a>
            <a onclick="showSection('profile')" id="nav-profile" class="menu-item">👤 會員資料</a>
        </div>

        <!-- 右側內容 -->
        <div class="main-content">
            
            <!-- 1. 線上訂票 -->
            <div id="booking" class="section-view">
                <h2>線上訂票</h2>
                
                <!-- Step 1 -->
                <div id="step1" class="section-box">
                    <label>1. 選擇電影</label>
                    <select id="movieSelect" onchange="loadDates()"><option>載入中...</option></select>
                    
                    <label>2. 選擇日期</label>
                    <select id="dateSelect" onchange="loadShowings()" disabled><option>請先選電影</option></select>

                    <label>3. 選擇場次</label>
                    <select id="showingSelect" onchange="loadTicketTypes()" disabled><option>請先選日期</option></select>
                </div>

                <!-- Step 2 -->
                <div id="step2" class="hidden section-box">
                    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
                        <div style="flex: 1;">
                            <h4>4. 票種選擇</h4>
                            <div id="ticketTypeArea"></div>
                        </div>
                        <div style="flex: 1;">
                            <h4>5. 餐點加購</h4>
                            <div id="mealArea"></div>
                        </div>
                    </div>
                    <div class="text-right" style="margin-top: 20px;">
                        <p style="font-size: 18px;">預估金額: <span style="color: var(--primary-color); font-weight: bold;">$<span id="tempPrice">0</span></span></p>
                        <button class="btn btn-primary" onclick="loadSeats()">下一步：選擇座位</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div id="step3" class="hidden section-box text-center">
                    <h4>6. 選擇座位</h4>
                    <p class="text-muted">請點擊選擇 <span id="requiredSeats" style="color: #fff; font-weight: bold;">0</span> 個座位</p>
                    <div id="seatMap" class="seat-grid"></div>
                    
                    <div style="background: #2c2c2c; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left;">
                        <p style="font-size: 20px;">總金額: <span style="color: var(--primary-color); font-weight: bold;">$<span id="finalPrice">0</span></span></p>
                        <label>付款方式</label>
                        <select id="payMethod">
                            <option value="card">會員儲值卡 (餘額扣款)</option>
                            <option value="bank">信用卡線上刷卡</option>
                        </select>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="confirmBooking()">確認付款與訂票</button>
                    </div>
                </div>
            </div>

            <!-- 2. 訂票紀錄 -->
            <div id="myTickets" class="section-view hidden">
                <h2>訂票紀錄</h2>
                <div id="ticketList">載入中...</div>
            </div>

            <!-- 3. 會員資料 -->
            <div id="profile" class="section-view hidden">
                <h2>修改會員資料</h2>
                <div class="section-box">
                    <label>姓名</label>
                    <input type="text" id="profileName">
                    <label>手機</label>
                    <input type="text" id="profilePhone">
                    <button class="btn btn-primary" onclick="updateProfile()">儲存修改</button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <div class="nav-container" style="justify-content: center;">
            <p>&copy; 2025 威宇影城. Member Center.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        const userId = 'A123456789'; // 模擬 Session ID
        let currentShowingId = null;
        let selectedSeats = [];
        let ticketCart = {};
        let mealCart = {};
        let totalTickets = 0;

        // 初始化
        (async function init() {
            await loadMovies();
        })();

        function showSection(id) {
            document.querySelectorAll('.section-view').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.menu-item').forEach(s => s.classList.remove('active'));
            
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('nav-' + id).classList.add('active');
            
            if(id === 'myTickets') loadMyTickets();
            if(id === 'profile') loadProfile();
        }

        // --- 沿用您原本的 JS 邏輯 (只修改 UI 操作) ---

        async function loadMovies() {
            const res = await callApi('get_movies', {}, 'GET');
            const sel = document.getElementById('movieSelect');
            sel.innerHTML = '<option value="">請選擇電影</option>';
            res.forEach(m => {
                sel.innerHTML += `<option value="${m.movieId}">${m.movieName}</option>`;
            });
        }

        async function loadDates() {
            const mid = document.getElementById('movieSelect').value;
            const res = await callApi('get_dates', {movieId: mid}, 'GET');
            const sel = document.getElementById('dateSelect');
            sel.disabled = false;
            sel.innerHTML = '<option value="">請選擇日期</option>';
            if(res.length === 0) sel.innerHTML += '<option value="2025-10-30">2025-10-30 (模擬)</option>';
            else res.forEach(d => sel.innerHTML += `<option value="${d.showingDate}">${d.showingDate}</option>`);
        }

        async function loadShowings() {
            const mid = document.getElementById('movieSelect').value;
            const date = document.getElementById('dateSelect').value;
            const res = await callApi('get_showings', {movieId: mid, date: date}, 'GET');
            const sel = document.getElementById('showingSelect');
            sel.disabled = false;
            sel.innerHTML = '<option value="">請選擇場次</option>';
            if(res.length === 0) sel.innerHTML += '<option value="101">14:30 (模擬場次)</option>';
            else res.forEach(s => sel.innerHTML += `<option value="${s.showingId}">${s.startTime} (${s.cinemaName})</option>`);
        }

        async function loadTicketTypes() {
            document.getElementById('step2').classList.remove('hidden');
            const types = await callApi('get_ticket_types', {}, 'GET');
            const tArea = document.getElementById('ticketTypeArea');
            tArea.innerHTML = '';
            
            // 若無資料則使用模擬
            const typeData = types.length ? types : [
                {ticketClassId:1, ticketClassName:'全票', ticketClassPrice:300},
                {ticketClassId:2, ticketClassName:'學生票', ticketClassPrice:250}
            ];

            typeData.forEach(t => {
                tArea.innerHTML += `
                    <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                        <span>${t.ticketClassName} <small class="text-muted">$${t.ticketClassPrice}</small></span>
                        <input type="number" min="0" max="10" value="0" style="width: 70px; margin: 0;"
                            onchange="updateCart('ticket', ${t.ticketClassId}, ${t.ticketClassPrice}, '${t.ticketClassName}', this.value)">
                    </div>`;
            });

            const meals = await callApi('get_meals', {}, 'GET');
            const mArea = document.getElementById('mealArea');
            mArea.innerHTML = '';
            const mealData = meals.length ? meals : [
                {mealsId:1, mealsName:'爆米花', mealsPrice:120},
                {mealsId:2, mealsName:'可樂', mealsPrice:60}
            ];

            mealData.forEach(m => {
                mArea.innerHTML += `
                    <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                        <span>${m.mealsName} <small class="text-muted">+$${m.mealsPrice}</small></span>
                        <input type="number" min="0" max="10" value="0" style="width: 70px; margin: 0;"
                            onchange="updateCart('meal', ${m.mealsId}, ${m.mealsPrice}, '${m.mealsName}', this.value)">
                    </div>`;
            });
        }

        function updateCart(type, id, price, name, qty) {
            qty = parseInt(qty);
            if(type === 'ticket') ticketCart[id] = {price, qty, name};
            if(type === 'meal') mealCart[id] = {price, qty, name};
            calcTotal();
        }

        function calcTotal() {
            let sum = 0;
            totalTickets = 0;
            for(let k in ticketCart) {
                sum += ticketCart[k].price * ticketCart[k].qty;
                totalTickets += ticketCart[k].qty;
            }
            for(let k in mealCart) {
                sum += mealCart[k].price * mealCart[k].qty;
            }
            document.getElementById('tempPrice').innerText = sum;
            document.getElementById('finalPrice').innerText = sum;
            document.getElementById('requiredSeats').innerText = totalTickets;
        }

        async function loadSeats() {
            if(totalTickets === 0) { alert("請至少購買一張票"); return; }
            currentShowingId = document.getElementById('showingSelect').value;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');

            const res = await callApi('get_seats', { showingId: currentShowingId }, 'GET');
            const seatMap = document.getElementById('seatMap');
            seatMap.innerHTML = '';
            
            for(let i=1; i<=20; i++) {
                let div = document.createElement('div');
                div.className = 'seat';
                div.innerText = i;
                
                let isOccupied = false;
                if(res && res.length > 0) {
                    const s = res.find(x => x.seatNumber == i);
                    if(s && s.seatEmpty == 0) isOccupied = true;
                }
                // 模擬部分佔用
                if([2,5,18].includes(i)) isOccupied = true;

                if (isOccupied) {
                    div.classList.add('occupied');
                } else {
                    div.onclick = () => {
                        if(!div.classList.contains('selected') && selectedSeats.length >= totalTickets) {
                            alert("座位數已達購買張數上限"); return;
                        }
                        toggleSeat(div, i);
                    };
                }
                seatMap.appendChild(div);
            }
        }

        function toggleSeat(el, num) {
            if(el.classList.contains('selected')) {
                el.classList.remove('selected');
                selectedSeats = selectedSeats.filter(s => s !== num);
            } else {
                el.classList.add('selected');
                selectedSeats.push(num);
            }
        }

        async function confirmBooking() {
            if(selectedSeats.length !== totalTickets) { alert(`請選擇 ${totalTickets} 個座位`); return; }
            const payMethod = document.getElementById('payMethod').value;
            const totalPrice = document.getElementById('finalPrice').innerText;
            let mealStr = [];
            for(let k in mealCart) if(mealCart[k].qty > 0) mealStr.push(`${mealCart[k].name}x${mealCart[k].qty}`);
            let mainTicketId = 1;
            for(let k in ticketCart) if(ticketCart[k].qty > 0) { mainTicketId = k; break; }

            const data = {
                userId: userId,
                showingId: currentShowingId,
                seats: selectedSeats,
                totalPrice: totalPrice,
                paymentMethod: payMethod,
                meals: mealStr.join(','),
                ticketTypeId: mainTicketId
            };
            
            const res = await callApi('booking', data, 'POST');
            alert(res.message);
            if(res.status) location.reload();
        }

        async function loadMyTickets() {
            const list = document.getElementById('ticketList');
            list.innerHTML = '<p class="text-center text-muted">載入中...</p>';
            const res = await callApi('my_tickets', { userId: userId }, 'POST');
            
            if(!res.status) { list.innerHTML = `<p class="text-center">${res.message}</p>`; return; }

            list.innerHTML = '';
            res.data.forEach(ticket => {
                let statusBadge = ticket.orderStatusId == 1 ? 
                    '<span style="color:#4caf50">✅ 已支付</span>' : '<span style="color:#9e9e9e">🚫 已退票</span>';
                
                let btns = ticket.orderStatusId == 1 ? `
                    <button class="btn btn-warning" style="padding:5px 15px; font-size:14px;" onclick="doExchange('${ticket.orderNumber}')">換票</button>
                    <button class="btn btn-danger" style="padding:5px 15px; font-size:14px;" onclick="doRefund('${ticket.orderNumber}')">退票</button>
                ` : '';

                list.innerHTML += `
                    <div class="ticket-card">
                        <div>
                            <h3 style="margin:0; border:none; padding:0;">${ticket.movieName}</h3>
                            <p class="text-muted" style="margin:5px 0;">${ticket.showingDate} ${ticket.startTime} | ${ticket.cinemaName}</p>
                            <p style="margin:0;">座位: ${ticket.seat} | 取票碼: <b style="color:var(--primary-color); font-size:1.1em;">${ticket.getTicketNum}</b></p>
                        </div>
                        <div class="text-right">
                            <p style="font-weight:bold; font-size:18px; margin:0 0 10px 0;">$${ticket.totalPrice}</p>
                            <div style="margin-bottom:10px;">${statusBadge}</div>
                            ${btns}
                        </div>
                    </div>
                `;
            });
        }

        async function doRefund(orderNum) {
            if(!confirm("確定要退票嗎？")) return;
            const res = await callApi('refund', { userId: userId, orderNumber: orderNum });
            alert(res.message);
            loadMyTickets();
        }

        async function doExchange(orderNum) {
            alert("已送出換票申請，請稍候...");
        }

        async function updateProfile() {
            const name = document.getElementById('profileName').value;
            const phone = document.getElementById('profilePhone').value;
            const res = await callApi('update_profile', { userId: userId, name, phone });
            alert(res.message);
        }

        async function logout() {
            await callApi('logout', {}, 'GET');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
