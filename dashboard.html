<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會員首頁 - 威宇影城</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .nav { background: #333; padding: 10px; color: white; display: flex; gap: 15px; }
        .nav a { color: white; text-decoration: none; cursor: pointer; }
        .section { display: none; margin-top: 20px; }
        .section.active { display: block; }
        
        /* 座位表樣式 */
        .seat-grid { display: grid; grid-template-columns: repeat(10, 40px); gap: 10px; margin-top: 20px; }
        .seat { width: 40px; height: 40px; background: #ddd; border: 1px solid #999; text-align: center; line-height: 40px; cursor: pointer; }
        .seat.selected { background: #28a745; color: white; }
        .seat.occupied { background: #dc3545; color: white; cursor: not-allowed; }
        
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="nav">
    <div>威宇影城</div>
    <a onclick="showSection('booking')">線上訂票</a>
    <a onclick="showSection('myTickets')">訂票紀錄</a>
    <a onclick="showSection('profile')">會員資料</a>
    <a href="login.html" onclick="logout()">登出</a>
</div>

<!-- 1. 線上訂票區塊 (Element B) -->
<div id="booking" class="section active">
    <h3>線上訂票</h3>
    <div id="step1">
        <label>選擇電影：</label>
        <select id="movieSelect" onchange="loadDates()"><option>載入中...</option></select>
        
        <label>選擇日期：</label>
        <select id="dateSelect" onchange="loadShowings()" disabled><option>請先選電影</option></select>

        <label>選擇場次：</label>
        <select id="showingSelect" onchange="enableNext()" disabled><option>請先選日期</option></select>
        
        <br><br>
        <button id="btnNext" disabled onclick="loadSeats()">下一步：選擇座位</button>
    </div>

    <div id="step2" class="hidden" style="display:none;">
        <h4>選擇座位 (Element B18-B20)</h4>
        <div id="seatMap" class="seat-grid"></div>
        <br>
        <p>總金額: $<span id="totalPrice">0</span></p>
        <button onclick="confirmBooking()">確認訂票</button>
        <button onclick="location.reload()">重選</button>
    </div>
</div>

<!-- 2. 訂票紀錄區塊 (Element In, R) -->
<div id="myTickets" class="section">
    <h3>我的訂票紀錄</h3>
    <div id="ticketList">載入中...</div>
</div>

<!-- 3. 會員資料區塊 (Element M) -->
<div id="profile" class="section">
    <h3>修改會員資料</h3>
    <label>姓名：</label><input type="text" id="profileName"><br>
    <label>手機：</label><input type="text" id="profilePhone"><br>
    <button onclick="updateProfile()">儲存修改</button>
</div>

<script src="js/api.js"></script>
<script>
    // 模擬從 Session 取得 UserID (實際專案應由後端 Session 控制)
    const userId = 'A123456789'; 
    let currentShowingId = null;
    let selectedSeats = [];
    const TICKET_PRICE = 300; // 假設票價

    // 初始化
    (async function init() {
        await loadMovies();
    })();

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'myTickets') loadMyTickets();
        if(id === 'profile') loadProfile();
    }

    // --- 訂票流程 (Element B) ---

    async function loadMovies() {
        const res = await callApi('get_movies', {}, 'GET');
        const sel = document.getElementById('movieSelect');
        sel.innerHTML = '<option value="">請選擇</option>';
        res.forEach(m => {
            sel.innerHTML += `<option value="${m.movieId}">${m.movieName}</option>`;
        });
    }

    async function loadDates() {
        const mid = document.getElementById('movieSelect').value;
        // 這裡簡化：實際應呼叫 get_dates API，這裡直接開放選擇
        document.getElementById('dateSelect').disabled = false;
        document.getElementById('dateSelect').innerHTML = '<option value="2025-10-30">2025-10-30</option>';
    }

    async function loadShowings() {
        document.getElementById('showingSelect').disabled = false;
        document.getElementById('showingSelect').innerHTML = '<option value="101">14:30 (A廳)</option><option value="102">17:30 (B廳)</option>';
    }

    function enableNext() {
        document.getElementById('btnNext').disabled = false;
    }

    async function loadSeats() {
        currentShowingId = document.getElementById('showingSelect').value;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';

        // 模擬從後端 B18 SearchSeat 取得座位
        // const res = await callApi('get_seats', { showingId: currentShowingId }, 'GET');
        // 這裡用假資料模擬
        const seatMap = document.getElementById('seatMap');
        seatMap.innerHTML = '';
        for(let i=1; i<=20; i++) {
            const div = document.createElement('div');
            div.className = 'seat';
            div.innerText = i;
            if ([2, 5, 18].includes(i)) {
                div.classList.add('occupied'); // 已被訂
            } else {
                div.onclick = () => toggleSeat(div, i);
            }
            seatMap.appendChild(div);
        }
    }

    function toggleSeat(el, num) {
        if(el.classList.contains('selected')) {
            el.classList.remove('selected');
            selectedSeats = selectedSeats.filter(s => s !== num);
        } else {
            el.classList.add('selected');
            selectedSeats.push(num);
        }
        document.getElementById('totalPrice').innerText = selectedSeats.length * TICKET_PRICE;
    }

    async function confirmBooking() {
        if(selectedSeats.length === 0) { alert('請選擇座位'); return; }
        // 呼叫 B1 MainBook (CreateBooking)
        alert(`訂票成功！\n場次ID: ${currentShowingId}\n座位: ${selectedSeats.join(',')}\n總金額: $${selectedSeats.length * TICKET_PRICE}`);
        location.reload();
    }

    // --- 訂票紀錄 & 退票 (Element In, R) ---

    async function loadMyTickets() {
        const list = document.getElementById('ticketList');
        const res = await callApi('my_tickets', { userId: userId }, 'POST');
        
        if(!res.status) {
            list.innerHTML = res.message;
            return;
        }

        list.innerHTML = '';
        res.data.forEach(ticket => {
            const status = ticket.orderStatusId == 1 ? '已支付' : '已退票';
            const btnRefund = ticket.orderStatusId == 1 ? `<button onclick="doRefund('${ticket.orderNumber}')">退票</button>` : '';
            
            list.innerHTML += `
                <div class="card">
                    <h4>${ticket.movieName} (${status})</h4>
                    <p>影城: ${ticket.cinemaName} | 時間: ${ticket.showingDate} ${ticket.startTime}</p>
                    <p>座位: ${ticket.seat} | 取票序號: <b>${ticket.getTicketNum}</b></p>
                    ${btnRefund}
                </div>
            `;
        });
    }

    async function doRefund(orderNum) {
        if(!confirm("確定要退票嗎？(需在開演前2小時)")) return;
        
        const res = await callApi('refund', { userId: userId, orderNumber: orderNum });
        alert(res.message);
        loadMyTickets();
    }

    // --- 會員資料 (Element M) ---
    
    async function updateProfile() {
        const name = document.getElementById('profileName').value;
        const phone = document.getElementById('profilePhone').value;
        
        const res = await callApi('update_profile', { userId: userId, name: name, phone: phone });
        alert(res.message);
    }
    
    async function logout() {
        await callApi('logout', {}, 'GET');
    }
</script>
</body>
</html>
